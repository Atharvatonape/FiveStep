apiVersion: apps/v1
kind: Deployment
metadata:
  name: fivestep
  labels:
    app: fivestep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fivestep
  template:
    metadata:
      labels:
        app: fivestep
    spec:
      containers:
        - name: web
          # Rendered by scripts/up.sh (envsubst) to point at your own ECR image.
          image: ${IMAGE_URI}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
